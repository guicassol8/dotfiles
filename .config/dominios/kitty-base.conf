# Base do kitty: o que nao muda com o dominio. Cores, fonte e cursor vem de
# ~/.config/dominios/atual/kitty.conf (incluido logo depois deste arquivo).
enable_audio_bell no
confirm_os_window_close 0
hide_window_decorations yes
scrollback_lines 10000
copy_on_select clipboard
mouse_hide_wait 2.0
strip_trailing_spaces smart
cursor_blink_interval 0
update_check_interval 0
dynamic_background_opacity yes
linux_display_server wayland
shell_integration enabled
tab_bar_edge top
tab_bar_min_tabs 2
# Rolagem como no Alacritty antigo
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map shift+home      scroll_home
map shift+end       scroll_end
map ctrl+0          change_font_size all 0
