# Dominios: fonte unica de cor, fonte e forma do desktop.
#
# Quem le este arquivo: gerar/construir.py (renderiza tudo em _build/<dominio>/)
# e bin/dominio (troca o dominio ativo). Nenhum modelo em modelos/ tem cor ou
# fonte literal: mudar um valor aqui e rodar `dominio construir` tem de bastar.
#
# Cor em hex de 6 digitos. `raio`, `borda` e `vaos` em pixels logicos.
# A ordem de [ordem].lista e a ordem do ciclo de `dominio proximo`.
# [ordem].extras sao dominios que existem mas ficam FORA do ciclo (e do sorteio do
# boot): so entram por nome, pelo seletor ou por `dominio apresentar` (Mod+N).
#
# [<dominio>.modo] e opcional. Chaves (padrao entre parenteses):
#   apresentacao (false)  ao entrar liga o Nao Perturbe e segura a tela acordada;
#                         ao sair devolve os dois como estavam
#   saudacao     (true)   o terminal abre com a ficha do dominio (fastfetch)
# [<dominio>.login] e opcional: ajustes da tela de login (chaves em gerar/login.py).

[ordem]
lista = ["sistema", "grimorio", "setor2814", "maldicao"]
extras = ["neutro"]

# ---------------------------------------------------------------- SISTEMA
