# Contemplacao: depois de `minutos` sem mexer no notebook, o HUD mostra so o cenario vivo
# em tela cheia (protetor de tela); qualquer tecla ou mouse desfaz. So na tomada e com a
# memoria folgada; video ou chamada segurando a tela acordada impede. Quem conta o tempo e
# o ocioso do Noctalia. Depois de mudar: `dominio construir grimorio`.
[grimorio.contemplacao]
ligada = true
minutos = 3

