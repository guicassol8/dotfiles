# Domínios: tema de login.
# O domínio mostrado vem daqui ou de theme.conf.user, que o SDDM lê por cima deste
# arquivo. O instalador faz de theme.conf.user um link para /var/lib/dominios/sddm.conf,
# que o comando `dominio` reescreve a cada troca. É só dado: um nome de domínio.
# Nome desconhecido ou arquivo ausente caem no padrão de dominios.js.
[General]
dominio=sistema
