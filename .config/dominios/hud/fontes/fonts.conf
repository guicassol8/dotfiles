<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- So as fontes que o HUD usa (FONTCONFIG_FILE no servico): menos memoria no qs. -->
<fontconfig>
  <dir>~/.local/share/fonts/dominios</dir>
  <dir>~/.local/share/fonts/despertar-da-mana</dir>
  <dir>/usr/share/fonts/TTF</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
