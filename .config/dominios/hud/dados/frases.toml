# Frases de estoicos para a Página do dia. Escolha deterministica pelo dia do ano.
# Traducoes livres para PT-BR; autor e obra so quando ha certeza de onde vem.

[[frase]]
texto = "O impedimento à ação faz avançar a ação. O que está no caminho se torna o caminho."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "A tua alma toma a cor dos teus pensamentos."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Se algo externo te aflige, não é ele que te perturba, mas o teu julgamento sobre ele. E está em teu poder apagar esse julgamento agora."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Ao amanhecer, quando custar levantar, pensa: acordo para fazer o trabalho de um ser humano."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Não ajas como se tivesses dez mil anos de vida. A necessidade pesa sobre ti. Enquanto vives, enquanto podes, sê bom."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Não percas tempo discutindo como deve ser um homem bom. Sê um."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Podes retirar-te para dentro de ti quando quiseres. Em lugar nenhum o homem encontra retiro mais tranquilo do que na própria alma."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "O melhor modo de te vingares é não te pareceres com quem te ofendeu."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Ninguém perde outra vida que não a que vive, nem vive outra que não a que perde."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "O que não faz bem ao enxame não faz bem à abelha."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "A perfeição do caráter é passar cada dia como se fosse o último, sem agitação, sem torpor, sem fingimento."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "A maior parte do que dizemos e fazemos é desnecessária. Elimina o supérfluo e terás mais tempo e menos perturbação."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Tudo é efêmero: quem lembra e quem é lembrado."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Ama o ofício que aprendeste e descansa nele."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "O que não prejudica a cidade não prejudica o cidadão."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Se não é correto, não o faças. Se não é verdade, não o digas."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Não te envergonhes de receber ajuda. Tens um posto a cumprir, como o soldado no assalto à muralha."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "A mente livre das paixões é uma cidadela. O homem não tem refúgio mais seguro."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Sê como o promontório contra o qual as ondas se quebram sem cessar. Ele permanece firme e amansa a fúria da água ao redor."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "O universo é mudança. A vida é opinião."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Não te esmagues com a imagem da vida inteira. Pergunta apenas: o que há de insuportável neste momento?"
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Faz o teu dever, com frio ou com calor, com sono ou descansado, louvado ou censurado."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Olha para dentro. Ali está a fonte do bem, e ela jorrará sempre, se continuares a cavar."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "A ira e a tristeza que uma ofensa provoca costumam ser mais danosas do que a própria ofensa."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Não te aborreças nem desanimes se nem sempre agires conforme os princípios. Depois de cair, volta ao caminho."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Cada um vive somente o presente. O resto ou já passou ou é incerto."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Retira a opinião de que foste prejudicado e removes o sentimento de dano. Remove o sentimento e removes o dano."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Os homens existem uns para os outros. Instrui-os ou suporta-os."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Se algo é possível e próprio da natureza humana, crê que também está ao teu alcance."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Nada é tão capaz de elevar a alma quanto examinar com método e verdade tudo o que se apresenta na vida."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Começa o dia dizendo a ti mesmo: hoje encontrarei o intrometido, o ingrato, o arrogante, o invejoso. Eles são assim por ignorarem o bem e o mal."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Admira-me que cada um se ame mais do que a todos e, no entanto, dê mais valor à opinião dos outros do que à própria."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Trata-te com respeito: a tua vida está quase no fim e ainda não te honraste."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Faze cada coisa com gravidade exata e sem afetação, com humanidade, liberdade e justiça."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Não gastes o que resta da vida pensando nos outros, a menos que seja em vista do bem comum."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Cada um vale o que valem as coisas a que dedica o seu zelo."
autor = "Marco Aurélio"
obra = "Meditações"

[[frase]]
texto = "Não é que tenhamos pouco tempo, mas desperdiçamos muito."
autor = "Sêneca"
obra = "Sobre a brevidade da vida"

[[frase]]
texto = "A vida, se souberes usá-la, é longa."
autor = "Sêneca"
obra = "Sobre a brevidade da vida"

[[frase]]
texto = "Vive-se a vida inteira aprendendo a viver."
autor = "Sêneca"
obra = "Sobre a brevidade da vida"

[[frase]]
texto = "O maior obstáculo à vida é a expectativa, que depende do amanhã e perde o hoje."
autor = "Sêneca"
obra = "Sobre a brevidade da vida"

[[frase]]
texto = "Tudo nos é alheio, Lucílio. Só o tempo é nosso."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Reivindica-te para ti mesmo."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Sofremos mais na imaginação do que na realidade."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Há mais coisas que nos assustam do que nos ferem, e sofremos mais com a opinião do que com os fatos."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Se um homem não sabe a que porto se dirige, nenhum vento lhe é favorável."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Não é porque as coisas são difíceis que não ousamos. É porque não ousamos que elas são difíceis."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Não é pobre quem tem pouco, mas quem deseja mais."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Se queres ser amado, ama."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "A filosofia ensina a agir, não a falar."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Ordena cada dia como se ele fechasse a fileira da tua vida."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "O que se previu fere menos."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Recolhe-te em ti mesmo o mais que puderes."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Se viveres segundo a natureza, nunca serás pobre. Se viveres segundo a opinião, nunca serás rico."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Reserva alguns dias para te contentares com pouca comida e roupa grosseira, e pergunta-te: era isto o que eu temia?"
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Meditar sobre a morte é meditar sobre a liberdade."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Vive para os outros, se queres viver para ti."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Viver, Lucílio, é militar."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "O destino conduz quem o aceita e arrasta quem resiste."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Importa não viver muito, mas viver bem. Como numa peça de teatro, vale a qualidade da atuação, não a duração."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "A verdadeira alegria é coisa séria."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "Escolhe um homem de bem e tem-no sempre diante dos olhos, vivendo como se ele te observasse."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "É preciso servir à filosofia para alcançar a verdadeira liberdade."
autor = "Sêneca"
obra = "Cartas a Lucílio"

[[frase]]
texto = "O fogo prova o ouro; a desgraça, os homens fortes."
autor = "Sêneca"
obra = "Sobre a providência"

[[frase]]
texto = "Ninguém me parece mais infeliz do que aquele a quem nunca aconteceu uma adversidade."
autor = "Sêneca"
obra = "Sobre a providência"

[[frase]]
texto = "Alguns sábios disseram que a ira é uma breve loucura."
autor = "Sêneca"
obra = "Sobre a ira"

[[frase]]
texto = "O melhor remédio contra a ira é o adiamento."
autor = "Sêneca"
obra = "Sobre a ira"

[[frase]]
texto = "Ao fim do dia, pergunta-te: que defeito corrigiste hoje? A que vício resististe? Em que ficaste melhor?"
autor = "Sêneca"
obra = "Sobre a ira"

[[frase]]
texto = "Onde quer que haja um ser humano, há lugar para a bondade."
autor = "Sêneca"
obra = "Sobre a vida feliz"

[[frase]]
texto = "Há coisas que dependem de nós e coisas que não dependem de nós."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "O que perturba as pessoas não são as coisas, mas os julgamentos que fazem sobre elas."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Não queiras que os acontecimentos sejam como desejas. Quere-os como são, e viverás em paz."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "A doença é um obstáculo para o corpo, mas não para a vontade, a menos que ela queira."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Lembra-te de que és ator num drama: cabe a ti representar bem o papel que o autor te deu."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Se queres progredir, aceita ser tido por tolo e ignorante nas coisas externas."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Nunca digas de uma coisa: perdi. Diz: devolvi."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Não é quem te insulta ou bate que te ofende, mas a opinião de que isso é ofensivo."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Ninguém pode te vencer se não entrares numa luta em que a vitória não depende de ti."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Em tudo o que fizeres, considera o que vem antes e o que vem depois, e só então começa."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Diante de uma crítica, responde: ele não conhece os meus outros defeitos, senão não mencionaria só esses."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Não te orgulhes de uma qualidade que não é tua."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Quando reconheces que algo é o certo a fazer, não temas ser visto fazendo-o, ainda que a multidão pense diferente."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Em vida, comporta-te como num banquete: quando o prato chegar a ti, serve-te com moderação. Se passar, não o detenhas."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "O homem comum espera o bem e o mal das coisas externas. O filósofo espera tudo de si mesmo."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Não te chames filósofo nem fales muito de princípios diante dos leigos. Pratica."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Para cada um, o corpo é a medida do que possui, como o pé é a medida do calçado."
autor = "Epicteto"
obra = "Manual"

[[frase]]
texto = "Diz primeiro a ti mesmo o que queres ser. Depois faz o que tens de fazer."
autor = "Epicteto"
obra = "Discursos"

[[frase]]
texto = "É impossível aprender aquilo que se julga já saber."
autor = "Epicteto"
obra = "Discursos"

[[frase]]
texto = "As dificuldades são o que revela os homens."
autor = "Epicteto"
obra = "Discursos"

[[frase]]
texto = "Todo hábito e toda faculdade se confirmam e crescem pelos atos correspondentes: o andar pelo andar, o correr pelo correr."
autor = "Epicteto"
obra = "Discursos"

[[frase]]
texto = "Se queres ser leitor, lê. Se queres ser escritor, escreve."
autor = "Epicteto"
obra = "Discursos"
