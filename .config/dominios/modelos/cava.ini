; Dominio {{nome}}. Gerado por `dominio construir`.
[general]
framerate = 30
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pipewire
source = auto

[output]
method = noncurses
channels = mono
mono_option = average

[color]
background = 'default'
gradient = 1
gradient_count = 4
gradient_color_1 = '{{cor.primaria|escuro:0.45}}'
gradient_color_2 = '{{cor.primaria}}'
gradient_color_3 = '{{cor.secundaria}}'
gradient_color_4 = '{{cor.terciaria}}'

[smoothing]
noise_reduction = 77
