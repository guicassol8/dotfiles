# Setor 2814: pilula de luz solida, estilo powerline
format = """[](primaria)[ 2814 ](bold bg:primaria fg:sobre_primaria)[](fg:primaria bg:superficie)$directory[](fg:superficie)$git_branch$git_status$jobs$fill$nodejs$python$rust$cmd_duration
$character"""

[fill]
symbol = " "

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
format = "[ $path$read_only ]($style)"
style = "bg:superficie fg:texto"

[git_branch]
symbol = " "
format = " [$symbol$branch]($style) "
style = "primaria"

[character]
success_symbol = "[▸](bold primaria)"
error_symbol = "[▸](bold erro)"
vimcmd_symbol = "[◂](bold terciaria)"
