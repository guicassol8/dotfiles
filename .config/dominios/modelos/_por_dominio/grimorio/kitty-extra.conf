# Grimorio: pena de escrever. Moldura interna reta, casando com a janela de pixel do niri. Cursor em barra, rastro de tinta (cor de mana pura), borda de pagina,
# marca d'agua do sigilo, abas em segmentos e barra de rolagem fina.
cursor_shape beam
cursor_beam_thickness 1.8
cursor_shape_unfocused hollow
cursor_blink_interval 0
cursor_trail 1
cursor_trail_decay 0.20 0.60
cursor_trail_start_threshold 3
cursor_trail_color {{elementos.mana-pura}}

window_padding_width 16 22
window_margin_width 3
window_border_width 1.5px
window_border_radius 0
draw_window_borders_for_single_window yes
active_border_color   {{cor.primaria}}
inactive_border_color {{cor.contorno}}
inactive_text_alpha 0.75
hide_window_decorations yes
confirm_os_window_close 0

window_logo_path {{raiz}}/papeis/grimorio-logo.png
window_logo_position bottom-right
window_logo_alpha 0.05
window_logo_scale 40

scrollbar scrolled
scrollbar_width 0.35
scrollbar_hover_width 0.7
scrollbar_handle_color {{cor.primaria}}
scrollbar_handle_opacity 0.55
scrollbar_track_hover_opacity 0.12
scrollbar_track_color {{cor.contorno}}

url_style curly
underline_hyperlinks hover
mouse_hide_wait 2.0
visual_bell_duration 0.25
visual_bell_color {{elementos.fogo}}
bell_on_tab "󰂞 "

# Abas: segmentos inclinados, so aparecem com 2 ou mais
tab_bar_edge top
tab_bar_margin_height 6.0 0.0
tab_bar_margin_width 8.0
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol " ✦"
tab_title_max_length 28
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab} {sup.index} {title} "
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab} ✦ {index} {title} "
active_tab_font_style bold
inactive_tab_font_style normal
tab_bar_margin_color {{cor.fundo}}

# Elemento ativo: ganchos/elemento.d/60-terminal reescreve este arquivo e o kitty recarrega (SIGUSR1).
# Fica por ultimo para sobrescrever fundo, cursor, selecao, bordas, abas e as cores de destaque.
include {{casa}}/.local/state/dominios/kitty-elemento.conf
