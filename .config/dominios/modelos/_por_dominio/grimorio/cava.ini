; Dominio {{nome}}. Gerado por `dominio construir`. Degrade dos elementos: mana, agua, vento, terra, eletricidade, fogo.
[general]
framerate = 30
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pipewire
source = auto

[output]
method = noncurses
channels = mono
mono_option = average

[color]
background = 'default'
gradient = 1
gradient_count = 6
gradient_color_1 = '{{elementos.mana-pura}}'
gradient_color_2 = '{{elementos.agua}}'
gradient_color_3 = '{{elementos.vento}}'
gradient_color_4 = '{{elementos.terra}}'
gradient_color_5 = '{{elementos.eletricidade}}'
gradient_color_6 = '{{elementos.fogo}}'

[smoothing]
noise_reduction = 70
monstercat = 1
waves = 0
