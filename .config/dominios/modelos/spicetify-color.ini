; Dominio {{nome}} para Spotify (Spicetify). Gerado por `dominio construir` de modelos/spicetify-color.ini.
; Um esquema so, sempre com o mesmo nome: a cada troca de dominio o arquivo inteiro e substituido.
; text / subtext: textos. main / sidebar / player: fundos das tres areas. card, highlight e
; main-elevated: cartoes, hover e menus. button: destaque (play, curtir, tocando agora).
[dominio]
text               = {{cor.texto|sem#}}
subtext            = {{cor.texto_suave|sem#}}
main               = {{cor.fundo|sem#}}
main-elevated      = {{cor.superficie2|sem#}}
highlight          = {{cor.superficie2|sem#}}
highlight-elevated = {{cor.superficie2|mistura:cor.contorno:0.45|sem#}}
sidebar            = {{cor.superficie|sem#}}
player             = {{cor.superficie|sem#}}
card               = {{cor.superficie2|sem#}}
shadow             = {{cor.fundo|escuro:0.5|sem#}}
selected-row       = {{cor.texto|sem#}}
button             = {{cor.primaria|sem#}}
button-active      = {{cor.primaria|claro:0.15|sem#}}
button-disabled    = {{cor.contorno|sem#}}
tab-active         = {{cor.superficie2|sem#}}
notification       = {{cor.primaria|escuro:0.5|sem#}}
notification-error = {{cor.erro|escuro:0.45|sem#}}
misc               = {{cor.texto_suave|sem#}}
