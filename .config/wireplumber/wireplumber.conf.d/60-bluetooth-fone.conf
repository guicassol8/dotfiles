# Fone Bluetooth sem susto (criado em 2026-11-10 junto com a correcao do audio).
# Por padrao o WirePlumber troca o fone para o perfil de headset (HSP/HFP, som de
# telefone, mono) sempre que algum app abre o microfone. Com isto desligado o fone
# fica no perfil de musica (A2DP) e o microfone usado e o do notebook.
# Para usar o microfone do fone numa chamada, troca o perfil na mao (painel de
# audio do shell ou pavucontrol, aba Configuracao). Para voltar ao padrao, apaga
# este arquivo e roda: systemctl --user restart wireplumber
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
